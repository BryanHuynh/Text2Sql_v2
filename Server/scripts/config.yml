# ----------------------datasets------------------------------
spider_training_dataset: "../spider_data/train_spider.json"
spider_training_tables_dataset: "../spider_data/tables.json"
spider_validation_dataset: "../spider_data/train_others.json"
spider_validation_tables_dataset: "../spider_data/tables.json"
spider_test_dataset: "../spider_data/test.json"
spider_test_tables_dataset: "../spider_data/test_tables.json"


# ----------------------directories---------------------------
pretrained_source_model: "google/flan-t5-large"
model_save_location: "models/"
compute_results_dir: "compute_results/"
checkpoint_dir: "ckpt/"
spider_database_dir: "../spider_data/database/"
spider_database_test_dir: "../spider_data/test_database/"

# ----------------------hyper-parmeters-----------------------
eval_strategy: "steps"
save_strategy: "steps"
load_best_model_at_end: True
metric_for_best_model: "eval_exec_acc"
greater_is_better: True
do_eval: True

learning_rate: 2e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
optim: "adafactor"
weight_decay: 0.01
label_smoothing_factor: 0.1

per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 32
gradient_checkpointing: True

bf16: True

predict_with_generate: True
generation_num_beams: 6
generation_max_length: 256

num_train_epochs: 10

dataloader_num_workers: 4
